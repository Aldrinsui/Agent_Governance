<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fb0ff"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#0e1116"/>

  <text x="30" y="38" fill="#8b95a3" font-size="12" letter-spacing="2">FLYYY.AI — AGENT GOVERNANCE ARCHITECTURE</text>

  <!-- Demo Agent -->
  <rect x="30" y="80" width="180" height="70" rx="6" fill="#151a21" stroke="#262e38"/>
  <text x="120" y="108" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Scripted Demo Agent</text>
  <text x="120" y="128" fill="#5a6472" font-size="10" text-anchor="middle">calls tools / data / actions</text>

  <!-- Events -->
  <rect x="270" y="80" width="160" height="70" rx="6" fill="#151a21" stroke="#4fb0ff"/>
  <text x="350" y="108" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Event</text>
  <text x="350" y="128" fill="#5a6472" font-size="10" text-anchor="middle">POST /events</text>

  <!-- Detection Engine -->
  <rect x="480" y="60" width="220" height="110" rx="6" fill="#151a21" stroke="#262e38"/>
  <text x="590" y="85" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Detection Engine</text>
  <text x="590" y="108" fill="#8b95a3" font-size="10" text-anchor="middle">Profile deviation check</text>
  <text x="590" y="124" fill="#8b95a3" font-size="10" text-anchor="middle">Guardrail threshold check</text>
  <text x="590" y="145" fill="#5a6472" font-size="9" text-anchor="middle">(reads Agent Profile)</text>

  <!-- Agent Profile store -->
  <rect x="480" y="200" width="220" height="80" rx="6" fill="#151a21" stroke="#262e38" stroke-dasharray="3,3"/>
  <text x="590" y="228" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Agent Profile</text>
  <text x="590" y="248" fill="#5a6472" font-size="10" text-anchor="middle">tools · data · actions</text>
  <text x="590" y="264" fill="#5a6472" font-size="10" text-anchor="middle">guardrails</text>

  <!-- Finding -->
  <rect x="750" y="60" width="180" height="70" rx="6" fill="#151a21" stroke="#e0524a"/>
  <text x="840" y="88" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Finding</text>
  <text x="840" y="108" fill="#5a6472" font-size="10" text-anchor="middle">evidence + explanation</text>

  <!-- Policy table -->
  <rect x="750" y="160" width="180" height="70" rx="6" fill="#151a21" stroke="#262e38"/>
  <text x="840" y="188" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Policy Table</text>
  <text x="840" y="208" fill="#5a6472" font-size="10" text-anchor="middle">type → severity → response</text>

  <!-- Response engine / state machine -->
  <rect x="980" y="80" width="170" height="90" rx="6" fill="#151a21" stroke="#e0a83e"/>
  <text x="1065" y="108" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">State Machine</text>
  <text x="1065" y="128" fill="#8b95a3" font-size="10" text-anchor="middle">ACTIVE / PAUSED</text>
  <text x="1065" y="144" fill="#8b95a3" font-size="10" text-anchor="middle">/ BLOCKED</text>

  <!-- Audit Log -->
  <rect x="980" y="220" width="170" height="70" rx="6" fill="#151a21" stroke="#7fd99a"/>
  <text x="1065" y="248" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Audit Log</text>
  <text x="1065" y="268" fill="#5a6472" font-size="10" text-anchor="middle">immutable, append-only</text>

  <!-- Human -->
  <rect x="980" y="340" width="170" height="70" rx="6" fill="#151a21" stroke="#4fb0ff"/>
  <text x="1065" y="368" fill="#e6e9ed" font-size="13" text-anchor="middle" font-weight="600">Human Reviewer</text>
  <text x="1065" y="388" fill="#5a6472" font-size="10" text-anchor="middle">approve / reject</text>

  <!-- Arrows: main flow -->
  <line x1="210" y1="115" x2="265" y2="115" stroke="#4fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="115" x2="475" y2="115" stroke="#4fb0ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="170" x2="590" y2="196" stroke="#5a6472" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="700" y1="100" x2="745" y2="95" stroke="#e0524a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="130" x2="840" y2="155" stroke="#5a6472" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="930" y1="180" x2="975" y2="145" stroke="#e0a83e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1065" y1="170" x2="1065" y2="216" stroke="#7fd99a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1065" y1="290" x2="1065" y2="336" stroke="#4fb0ff" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1000" y1="360" x2="700" y2="150" stroke="#4fb0ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Bottom row: API + persistence -->
  <rect x="30" y="460" width="1120" height="140" rx="6" fill="#151a21" stroke="#262e38"/>
  <text x="50" y="488" fill="#8b95a3" font-size="11" letter-spacing="1">FASTAPI SERVICE (single process)</text>

  <g font-size="11" fill="#e6e9ed">
    <rect x="50" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="120" y="527" text-anchor="middle">agents.py</text>

    <rect x="205" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="275" y="527" text-anchor="middle">profiles.py</text>

    <rect x="360" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="430" y="527" text-anchor="middle">events.py</text>

    <rect x="515" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="585" y="527" text-anchor="middle">findings.py</text>

    <rect x="670" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="740" y="527" text-anchor="middle">audit.py</text>

    <rect x="825" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="895" y="527" text-anchor="middle">demo.py</text>

    <rect x="980" y="505" width="140" height="34" rx="4" fill="#1b2129" stroke="#262e38"/>
    <text x="1050" y="527" text-anchor="middle">main.py</text>
  </g>

  <line x1="50" y1="560" x2="1120" y2="560" stroke="#262e38"/>
  <rect x="440" y="570" width="300" height="0" fill="none"/>
  <g font-size="11" fill="#8b95a3">
    <text x="60" y="580">↓ SQLAlchemy ORM</text>
    <rect x="480" y="565" width="220" height="26" rx="4" fill="#1b2129" stroke="#4fb0ff"/>
    <text x="590" y="583" fill="#e6e9ed" text-anchor="middle">PostgreSQL (Alembic-migrated)</text>
  </g>

  <text x="30" y="625" fill="#5a6472" font-size="10">
    Detection is synchronous and inline on POST /events — no queue, matching the assignment's "continuous evaluation" requirement without added infra.
  </text>
</svg>
