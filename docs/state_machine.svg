<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b95a3"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0e1116"/>
  <text x="30" y="36" fill="#8b95a3" font-size="12" letter-spacing="2">AGENT RESPONSE STATE MACHINE</text>

  <!-- ACTIVE -->
  <circle cx="180" cy="160" r="70" fill="#151a21" stroke="#7fd99a" stroke-width="2"/>
  <text x="180" y="155" fill="#7fd99a" font-size="15" text-anchor="middle" font-weight="700">ACTIVE</text>
  <text x="180" y="175" fill="#5a6472" font-size="9" text-anchor="middle">processing events</text>

  <!-- PAUSED -->
  <circle cx="470" cy="160" r="70" fill="#151a21" stroke="#e0a83e" stroke-width="2"/>
  <text x="470" y="155" fill="#e0a83e" font-size="15" text-anchor="middle" font-weight="700">PAUSED</text>
  <text x="470" y="175" fill="#5a6472" font-size="9" text-anchor="middle">awaiting human decision</text>

  <!-- BLOCKED -->
  <circle cx="740" cy="300" r="70" fill="#151a21" stroke="#e0524a" stroke-width="2"/>
  <text x="740" y="295" fill="#e0524a" font-size="15" text-anchor="middle" font-weight="700">BLOCKED</text>
  <text x="740" y="315" fill="#5a6472" font-size="9" text-anchor="middle">terminal (this system)</text>

  <!-- ACTIVE -> ACTIVE (notify) -->
  <path d="M 140 100 C 100 60, 220 60, 210 105" fill="none" stroke="#6b9fd6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="175" y="55" fill="#6b9fd6" font-size="10" text-anchor="middle">NOTIFY (no state change)</text>

  <!-- ACTIVE -> PAUSED -->
  <line x1="250" y1="160" x2="400" y2="160" stroke="#e0a83e" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="325" y="148" fill="#e0a83e" font-size="10" text-anchor="middle">REQUIRE_APPROVAL</text>

  <!-- ACTIVE -> BLOCKED (direct) -->
  <path d="M 220 220 C 400 340, 600 340, 685 335" fill="none" stroke="#e0524a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="450" y="365" fill="#e0524a" font-size="10" text-anchor="middle">BLOCK (unauthorized tool/data, or guardrail LIMIT)</text>

  <!-- PAUSED -> ACTIVE (approve) -->
  <path d="M 420 120 C 350 70, 250 70, 195 100" fill="none" stroke="#7fd99a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="325" y="80" fill="#7fd99a" font-size="10" text-anchor="middle">approve</text>

  <!-- PAUSED -> BLOCKED (reject) -->
  <line x1="525" y1="200" x2="690" y2="270" stroke="#e0524a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="640" y="220" fill="#e0524a" font-size="10" text-anchor="middle">reject</text>

  <text x="30" y="400" fill="#5a6472" font-size="10">
    Every arrow above writes an AuditLog row (event_type, from_state, to_state, actor, reason) before the transition is considered complete.
  </text>
</svg>
